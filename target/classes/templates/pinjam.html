
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Pinjam Buku</title>
</head>
<body>

    <h1>Form Peminjaman Buku</h1>

    <p th:if="${pesan}" th:text="${pesan}"></p>

    <form th:action="@{/pinjam}" method="post">

        <label>ID Anggota:</label>
        <input type="text" name="idAnggota" required>

        <br><br>

        <label>Pilih Buku:</label>
        <select name="idBuku" required>
            <option value="">-- Pilih Buku --</option>

            <option th:each="buku : ${daftarBuku}"
                    th:value="${buku.idBuku}"
                    th:text="${buku.judul + ' (Stok: ' + buku.stok + ')'}">
            </option>
        </select>

        <br><br>

        <button type="submit">Pinjam Buku</button>

    </form>

</body>
</html>

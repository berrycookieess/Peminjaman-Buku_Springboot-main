
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Anggota - Perpustakaan</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f4f6fa;
            color: #263445;
        }

        header {
            background: #1d3a7c;
            color: white;
            padding: 24px 40px;
        }

        header h1 {
            margin: 0 0 10px;
        }

        header p {
            margin: 0;
            font-size: 14px;
        }

        main {
            padding: 40px;
        }

        .navigation {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }

        .navigation a {
            text-decoration: none;
            color: #1d3a7c;
            font-weight: bold;
            padding: 10px 16px;
            background: white;
            border-radius: 8px;
            transition: 0.2s;
        }

        .navigation a:hover,
        .navigation a.active {
            background: #1d3a7c;
            color: white;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h2 {
            margin: 0 0 10px;
            color: #263445;
        }

        .page-heading p {
            margin: 0;
            color: #64748b;
            font-size: 14px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #00000010;
            overflow-x: auto;
        }

        .card-header {
            margin-bottom: 20px;
        }

        .card-header h2 {
            color: #1d3a7c;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 15px 16px;
            border-bottom: 1px solid #e5eaf2;
            font-size: 14px;
        }

        th {
            background: #f4f6fa;
            color: #1d3a7c;
            font-weight: bold;
        }

        tbody tr:hover td {
            background: #f8faff;
        }

        .member-id {
            color: #1d3a7c;
            font-weight: bold;
        }

        .empty {
            text-align: center;
            color: #64748b;
            padding: 25px;
        }

        @media (max-width: 600px) {
            header {
                padding: 22px 20px;
            }

            main {
                padding: 24px 16px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Perpustakaan</h1>
    <p>Sistem Informasi Manajemen Perpustakaan</p>
</header>

<main>

    <div class="page-heading">
        <h2>Data Anggota</h2>
        <p>Informasi anggota yang terdaftar dalam sistem perpustakaan.</p>
    </div>

    <nav class="navigation">
        <a th:href="@{/}">Dashboard</a>
        <a th:href="@{/buku}">Data Buku</a>
        <a th:href="@{/anggota}" class="active">Data Anggota</a>
        <a th:href="@{/pinjam}">Peminjaman</a>
    </nav>

    <section class="card">

        <div class="card-header">
            <h2>Daftar Anggota</h2>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID Anggota</th>
                    <th>Nama Anggota</th>
                    <th>Batas Peminjaman</th>
                </tr>
            </thead>

            <tbody>
                <tr th:each="anggota : ${daftarAnggota}">
                    <td class="member-id"
                        th:text="${anggota.idAnggota}"></td>
                    <td th:text="${anggota.nama}"></td>
                    <td th:text="${anggota.batasPinjam}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(daftarAnggota)}">
                    <td colspan="3" class="empty">
                        Belum ada data anggota yang terdaftar.
                    </td>
                </tr>
            </tbody>
        </table>

    </section>

</main>

</body>
</html>
